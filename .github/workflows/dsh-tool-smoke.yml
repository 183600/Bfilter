name: dsh-tool-smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DeepSeek Harness
        run: |
          npm i -g @deepseek-ai/dsh@0.2.1-rc.2
          dsh --version
      - name: Tool-use smoke test
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -e
          rm -f dsh_ci_probe.txt
          timeout 420 dsh --profile headless "在当前目录创建 dsh_ci_probe.txt，内容写 CI-OK；完成后只回复 CI-DONE" | tee /tmp/answer.txt
          test -f dsh_ci_probe.txt
          grep -qx "CI-OK" dsh_ci_probe.txt
          echo "[ok] tool use verified"
